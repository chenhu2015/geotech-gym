[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mechgym"
version = "0.0.1"
description = "Verifiable agentic environments for computational mechanics"
requires-python = ">=3.11"
# numpy pinned to 2.2.x: on this Windows machine Smart App Control blocks numpy 2.5 random DLLs.
dependencies = ["numpy>=2.0,<2.3", "scipy>=1.13"]

[project.optional-dependencies]
# Solvers (OpenSeesPy, ...) are meant to run in containers; see docker/. `fea` installs OpenSeesPy
# directly for environments that are themselves containers.
fea = ["openseespy>=3.8"]
dev = ["pytest>=8", "matplotlib>=3.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running benchmark searches (deselect with -m 'not slow')"]
